name: Build Unscroll Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/unscroll-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/signing/unscroll-release.jks" >> "$GITHUB_ENV"

      - name: Verify Release Keystore Password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK Generated
        run: ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload Unscroll Release APK
        uses: actions/upload-artifact@v4
        with:
          name: unscroll-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
